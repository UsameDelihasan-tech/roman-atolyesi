<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101116">
  <title>Roman Atölyesi</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="night">
  <div class="ambient-bg"></div>

  <header class="topbar">
    <button id="chaptersBtn" class="icon">☰</button>
    <div class="book-meta">
      <input id="bookTitle" value="Adsız Roman" aria-label="Roman adı">
      <small id="saveState">Kaydedildi</small>
    </div>
    <button id="focusBtn" class="icon">◐</button>
  </header>

  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <h2>Bölümler</h2>
      <button id="closeDrawer" class="icon">✕</button>
    </div>
    <button id="newChapter" class="primary">+ Yeni bölüm</button>
    <div id="chapterList"></div>
  </aside>
  <div id="scrim" class="scrim"></div>

  <main>
    <section class="editor-shell">
      <input id="chapterTitle" class="chapter-title" value="Bölüm 1">
      <textarea id="editor" placeholder="Hikâyen burada başlıyor…" spellcheck="true"></textarea>
    </section>
  </main>

  <footer>
    <div id="stats">0 kelime · 0 karakter</div>
    <div class="toolbar">
      <button id="themeBtn">🌙 Gece</button>
      <button id="soundBtn">🎧 Ambiyans</button>
      <button id="exportBtn">⇩ Dışa aktar</button>
    </div>
  </footer>

  <div id="themeSheet" class="sheet">
    <div class="sheet-card">
      <div class="handle"></div>
      <h3>Ambiyans</h3>
      <div class="theme-grid">
        <button data-theme="night">🌙<span>Gece</span></button>
        <button data-theme="rain">🌧️<span>Yağmur</span></button>
        <button data-theme="candle">🕯️<span>Mum</span></button>
        <button data-theme="library">📚<span>Kütüphane</span></button>
      </div>
      <button class="close-sheet">Kapat</button>
    </div>
  </div>

  <div id="soundSheet" class="sheet">
    <div class="sheet-card">
      <div class="handle"></div>
      <h3>Ambiyans sesi</h3>
      <div class="sound-grid">
        <button data-sound="rain">🌧️ Yağmur</button>
        <button data-sound="fire">🔥 Şömine</button>
        <button data-sound="brown">🌌 Derin uğultu</button>
        <button data-sound="off">🔇 Kapat</button>
      </div>
      <label class="volume">Ses
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.16">
      </label>
      <button class="close-sheet">Kapat</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
